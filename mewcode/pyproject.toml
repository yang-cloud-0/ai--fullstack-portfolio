[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode-terminal"
version = "1.0.0"
description = "多协议 LLM 终端助手"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "textual>=2,<9"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
