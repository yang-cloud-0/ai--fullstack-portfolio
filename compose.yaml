services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: analytics
      MYSQL_USER: analytics
      MYSQL_PASSWORD: ${ANALYTICS_DB_PASSWORD:-local-demo-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 4s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 4s
      timeout: 2s
      retries: 12

  agent:
    build:
      context: ./analytics
      dockerfile: agent/Dockerfile
    environment:
      MODEL_CHAT_COMPLETIONS_URL: ${MODEL_CHAT_COMPLETIONS_URL:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 12

  backend:
    build: ./analytics/backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: analytics
      SPRING_DATASOURCE_PASSWORD: ${ANALYTICS_DB_PASSWORD:-local-demo-password}
      SPRING_DATA_REDIS_HOST: redis
      ANALYTICS_REDIS_ENABLED: 'true'
      ANALYTICS_AGENT_URL: http://agent:8001
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy

  web:
    build: ./analytics/web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"

volumes:
  mysql-data:
